name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Boot the built app and prove the judge-facing routes actually serve — catches
      # "builds green but 404s in prod" (the exact failure mode our stale demo deploy had).
      - name: Smoke (started app serves key routes)
        run: |
          npm run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          fail=0
          for route in / /studio /mint /dashboard /leaderboard /hackathon /manifest.webmanifest /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$route" || true)
            echo "$route -> $code"
            [ "$code" = "200" ] || fail=1
          done
          kill $SERVER_PID || true
          exit $fail
